name: Supabase Keep-Alive Ping

on:
  schedule:
    # Run every 3 days at 06:00 UTC
    - cron: '0 6 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database Endpoint
        run: |
          echo "Sending keep-alive heartbeat query to Supabase..."
          curl -s "https://xiyudmicwbmogliiqdxf.supabase.co/rest/v1/stories?select=id&limit=1" \
            -H "apikey: sb_publishable_U8OoSRK4Bvr-kJBpopE36A_kY_cWtg5" \
            -H "Authorization: Bearer sb_publishable_U8OoSRK4Bvr-kJBpopE36A_kY_cWtg5"
          echo "Keep-alive ping completed successfully!"
